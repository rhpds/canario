# Prometheus Monitor Service (Metrics)
# OpenShift UWM rejects bearerTokenFile; use a SA token Secret instead.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: canario
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: canario-metrics-reader-token
          key: token
      tlsConfig:
        # Manager serves a self-signed metrics cert; skip verify for scrape.
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: canario
