---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: canarioruns.canario.rhpds.com
spec:
  group: canario.rhpds.com
  names:
    kind: CanarioRun
    listKind: CanarioRunList
    plural: canarioruns
    singular: canariorun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.suiteStatus
      name: Suite
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CanarioRun is a one-shot guest canary experiment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CanarioRunSpec is the desired configuration for a one-shot
              canary run.
            properties:
              guestImage:
                description: |-
                  GuestImage selects the boot disk (DataSource clone or registry pull).
                  Optional when the operator is configured with install-time defaults
                  (CANARIO_DEFAULT_GUEST_*); otherwise required.
                properties:
                  dataSource:
                    description: DataSource clones a Ready CDI DataSource in the given
                      namespace.
                    properties:
                      name:
                        description: Name of the DataSource (e.g. fedora, rhel9).
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the DataSource (cluster-specific;
                          no default).
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  registry:
                    description: Registry pulls via CDI (e.g. docker://quay.io/containerdisks/fedora:40).
                    type: string
                type: object
              profile:
                default: small
                description: 'Profile selects VM sizing: small (periodic default)
                  or default (larger).'
                enum:
                - small
                - default
                type: string
              storage:
                default: default
                description: |-
                  Storage selects how data disks are chosen: "default" (cluster default SC)
                  or "list" (explicit storageClasses).
                enum:
                - default
                - list
                type: string
              storageClasses:
                description: |-
                  StorageClasses is the explicit list of StorageClasses when storage=list
                  (one guest data disk per entry).
                items:
                  type: string
                type: array
              type:
                default: guest
                description: Type selects the canary experiment. "guest" creates a
                  temporary guest VM.
                enum:
                - guest
                type: string
              workers:
                default: all
                description: 'Workers selects placement: "all", "busiest", or a worker
                  node name.'
                type: string
            type: object
          status:
            description: CanarioRunStatus is the observed state of a CanarioRun.
            properties:
              completionTime:
                description: CompletionTime is when the experiment finished (UTC).
                format: date-time
                type: string
              message:
                description: Message is a human-readable detail for the current phase.
                type: string
              phase:
                description: Phase is Pending, Running, Succeeded, or Failed (aggregate
                  over workers).
                type: string
              suiteStatus:
                description: SuiteStatus is the overall suite status (running|succeeded|failed).
                type: string
              workers:
                description: Workers holds per-worker CioVM results (source of truth
                  for placement/disks).
                items:
                  description: WorkerResult is the per-worker CioVM outcome for a
                    CanarioRun.
                  properties:
                    cioVMName:
                      description: CioVMName is the owned KubeVirt VirtualMachine
                        on this node.
                      type: string
                    disks:
                      description: Disks are per-StorageClass suite results on this
                        worker.
                      items:
                        description: DiskResult holds suite metrics for one attached
                          data disk / StorageClass.
                        properties:
                          accessMode:
                            type: string
                          dataDev:
                            type: string
                          fileopsCreate1000Ms:
                            type: string
                          fileopsTarCreateMs:
                            type: string
                          fileopsTarExtractMs:
                            type: string
                          fioRandReadIOPS:
                            type: string
                          fioRandWriteIOPS:
                            type: string
                          fioSeqReadBW:
                            type: string
                          fioSeqWriteBW:
                            type: string
                          message:
                            type: string
                          nodeName:
                            type: string
                          provisioner:
                            type: string
                          sections:
                            type: string
                          storageClass:
                            type: string
                          suiteStatus:
                            type: string
                          volumeMode:
                            type: string
                        type: object
                      type: array
                    message:
                      description: Message is a human-readable detail for this worker.
                      type: string
                    nodeName:
                      description: NodeName is the worker node.
                      type: string
                    phase:
                      description: Phase is Pending, Running, Succeeded, or Failed
                        for this worker.
                      type: string
                    suiteStatus:
                      description: SuiteStatus is the in-guest suite status (running|succeeded|failed).
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
