---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - canario.rhpds.com
  resources:
  - canarioruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - canario.rhpds.com
  resources:
  - canarioruns/finalizers
  verbs:
  - update
- apiGroups:
  - canario.rhpds.com
  resources:
  - canarioruns/status
  verbs:
  - get
  - patch
  - update
