apiVersion: canario.rhpds.com/v1alpha1
kind: CanarioRun
metadata:
  name: canariorun-sample
spec:
  type: guest
  profile: small
  workers: all
  # guestImage optional when the operator ConfigMap has CANARIO_DEFAULT_GUEST_*.
  # Override per Run when needed:
  # guestImage:
  #   dataSource:
  #     name: rhel9
  #     namespace: openshift-virtualization-os-images
  storage: list
  storageClasses:
    - ocs-external-storagecluster-ceph-rbd
  # Optional — empty fields use operator ConfigMap / built-in defaults:
  # suite:
  #   sections: all
  # network:
  #   mode: auto
  #   pingTarget: 1.1.1.1
  #   dnsName: dns.google
  #   downloadURL: http://speedtest.tele2.net/1MB.zip
  #   gitURL: https://github.com/yordangit/ocp-virt-ux-bench.git
