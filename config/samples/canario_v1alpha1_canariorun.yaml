apiVersion: canario.rhpds.com/v1alpha1
kind: CanarioRun
metadata:
  name: canariorun-sample
spec:
  type: guest
  profile: small
  workers: all
  # guestImage optional when the operator ConfigMap has CANARIO_DEFAULT_GUEST_*.
  # Override per Run when needed:
  # guestImage:
  #   dataSource:
  #     name: rhel9
  #     namespace: openshift-virtualization-os-images
  storage: list
  storageClasses:
    - ocs-external-storagecluster-ceph-rbd
